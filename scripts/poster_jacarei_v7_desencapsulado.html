<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Z8 E-Motion // Jacareí - Desencapsulado</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #080a0e;
      font-family: 'Outfit', sans-serif;
      position: relative;
    }

    /* 1. Base Fotográfica Criada e Salva em /posters */
    .bg-master {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      background-image: url('../public/assets/cria/posters/base_jacarei_tank.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* 2. Área Tipográfica Desencapsulada (Safe Zone Inferior Y = 1320px a 1600px) */
    .unencapsulated-zone {
      position: absolute;
      bottom: 310px; /* Safe Zone de corte do Instagram */
      left: 70px;
      right: 70px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Hook PNL Provocante em Escala Aumentada */
    .pnl-hook-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-left: 3px solid #00f0ff;
      padding-left: 20px;
    }

    .pnl-main-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 48px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9), 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .pnl-sub-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.95), 0 1px 4px rgba(0, 0, 0, 1);
    }

    .pnl-sub-title strong {
      color: #00f0ff;
      font-weight: 700;
    }

    /* Textos Desencapsulados e Aumentados (Sem Pílulas / Sem Cápsulas) */
    .unencapsulated-metrics-row {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      padding-top: 6px;
    }

    .text-metric-white {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
    }

    .text-metric-divider {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: #334155;
    }

    .text-metric-cyan {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.85);
    }

    /* Linha de Contato e Concessão Direta (Sem Botão) */
    .direct-contact-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1.5px solid rgba(255, 255, 255, 0.16);
      padding-top: 14px;
      margin-top: 4px;
    }

    .contact-brand {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .contact-url {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: #00f0ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <!-- Base Fotográfica Pura de Backup Salva em /posters -->
  <div class="bg-master"></div>

  <!-- Área Tipográfica 100% Desencapsulada -->
  <div class="unencapsulated-zone">

    <!-- Hook PNL Provocante Aumentado -->
    <div class="pnl-hook-block">
      <div class="pnl-main-title">UMA CIDADE INTEIRA. UMA ÚNICA CHAVE.</div>
      <div class="pnl-sub-title">O mercado elétrico não espera. <strong>Quem chegar primeiro, domina.</strong></div>
    </div>

    <!-- Textos Desencapsulados em Escala Ampliada -->
    <div class="unencapsulated-metrics-row">
      <div class="text-metric-white">MONOPÓLIO TERRITORIAL</div>
      <div class="text-metric-divider">//</div>
      <div class="text-metric-cyan">APENAS 1 VAGA</div>
    </div>

    <!-- Linha Direta de Contato (Sem Botão) -->
    <div class="direct-contact-line">
      <div class="contact-brand">Z8 EMOTION // CONCESSÃO JACAREÍ - SP</div>
      <div class="contact-url">Z8EMOTION.COM</div>
    </div>

  </div>

</body>
</html>
