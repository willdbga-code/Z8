<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer dashed radar range ring (50km) -->
  <circle cx="50" cy="50" r="42" stroke="#00F0FF" stroke-width="2" stroke-dasharray="5 4" opacity="0.45"/>
  <!-- Middle radar boundary ring -->
  <circle cx="50" cy="50" r="28" stroke="#00F0FF" stroke-width="1.8" opacity="0.75"/>
  <!-- Inner core radar ring -->
  <circle cx="50" cy="50" r="14" stroke="#00F0FF" stroke-width="2.2"/>
  <!-- Center matrix station dot -->
  <circle cx="50" cy="50" r="4" fill="#00F0FF"/>
  <!-- Radar sweep line -->
  <path d="M50 50 L80 20" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Active blip / dealer node -->
  <circle cx="70" cy="30" r="4" fill="#FFFFFF"/>
</svg>
